[theme]
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["2.05rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
baseFontSize = 15
baseRadius = "0.55rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
metricValueFontSize = "1.7rem"
metricValueFontWeight = 650
linkUnderline = false

[theme.light]
primaryColor = "#24467f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#16181d"
borderColor = "#e3e5e9"
linkColor = "#2a63b8"
dataframeHeaderBackgroundColor = "#f4f5f7"
dataframeBorderColor = "#e3e5e9"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#f6f7f9"
borderColor = "#e3e5e9"

[theme.dark]
primaryColor = "#7aa7ec"
backgroundColor = "#14171c"
secondaryBackgroundColor = "#1d2128"
textColor = "#e8eaed"
borderColor = "#2b3038"
linkColor = "#8db4ef"
dataframeHeaderBackgroundColor = "#1d2128"
dataframeBorderColor = "#2b3038"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#101318"
borderColor = "#2b3038"

[server]
maxUploadSize = 5
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
